spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# Conexión a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tp2_db}
spring.datasource.username=${DB_USERNAME:usuario}
spring.datasource.password=${DB_PASSWORD:password}

# JWT
jwt.secret=${JWT_SECRET:secreto-super-seguro-para-firmar-jwt-con-longitud-minima-de-256-bits-tp}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Hibernate y JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Opcional: útil para ver las consultas que Hibernate ejecuta por detrás
spring.jpa.show-sql=true